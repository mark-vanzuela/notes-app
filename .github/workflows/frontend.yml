name: frontend

# CI for the React frontend.
#   - PRs to dev/main  → "Frontend CI" job: lint + test + build (required check; runs on
#     every PR so the required status always reports).
#   - Push to main     → also publish the nginx image to ghcr (path-filtered to frontend/**).
#   - workflow_dispatch → manual run.
# Deploy-to-Azure is added in the infra round (it will pull the image published here).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  publish:
    name: Publish web image
    # Never on PRs — only on push to main (or manual dispatch).
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mark-vanzuela/notes-app-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes these in at build time. Set as GitHub Actions repo VARIABLES
          # (public, not secrets). VITE_API_BASE_URL = https://<api_fqdn>/api after the
          # first terraform apply.
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}

  deploy:
    name: Deploy web to Azure
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # OIDC token for azure/login
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: >
          az containerapp update
          --name ${{ vars.ACA_WEB_NAME }}
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}
          --image ghcr.io/mark-vanzuela/notes-app-web:sha-${{ github.sha }}
