server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes like /notes/123/edit don't exist as files,
    # so serve index.html and let React Router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Let browsers cache fingerprinted assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
