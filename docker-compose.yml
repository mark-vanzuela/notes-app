# Base Compose stack for local development: web + api + postgres + pgadmin.
#
# All services are functional. `docker compose up --build` runs the whole stack;
# day-to-day frontend dev usually uses the Vite dev server (cd frontend && npm run dev).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-notesdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notes} -d ${POSTGRES_DB:-notesdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    environment:
      # Point at the Compose `db` service; same var is set to Neon in prod.
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=db;Port=5432;Database=notesdb;Username=notes;Password=notes_dev_password}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Auth config — supply real values via your .env (never commit secrets).
      Authentication__Google__ClientId: ${Authentication__Google__ClientId:-}
      Jwt__Issuer: ${Jwt__Issuer:-notes-app}
      Jwt__Audience: ${Jwt__Audience:-notes-app}
      Jwt__Key: ${Jwt__Key:-dev-only-super-secret-signing-key-change-me-32+chars}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-60}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # pgAdmin — web UI to browse/query the Postgres database during local dev.
  # Open http://localhost:5050 and log in with the email/password below. The
  # "Notes (local)" server is pre-registered (see docker/pgadmin/servers.json);
  # on first connect enter the DB password (POSTGRES_PASSWORD, default
  # "notes_dev_password").
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      # Desktop mode: skip the extra master-password prompt for a smoother local UX.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      # Vite bakes these in at BUILD time, so they're build args (not runtime env).
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  pgdata:
  pgadmin_data:
