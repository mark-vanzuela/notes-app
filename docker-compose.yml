# Base Compose stack for local development: web + api + postgres.
#
# `db` and `api` are functional. The `web` service stays commented out until the
# frontend round. Run `docker compose up --build db api` for the backend.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-notesdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notes} -d ${POSTGRES_DB:-notesdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    environment:
      # Point at the Compose `db` service; same var is set to Neon in prod.
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=db;Port=5432;Database=notesdb;Username=notes;Password=notes_dev_password}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Auth config — supply real values via your .env (never commit secrets).
      Authentication__Google__ClientId: ${Authentication__Google__ClientId:-}
      Jwt__Issuer: ${Jwt__Issuer:-notes-app}
      Jwt__Audience: ${Jwt__Audience:-notes-app}
      Jwt__Key: ${Jwt__Key:-dev-only-super-secret-signing-key-change-me-32+chars}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-60}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # web:
  #   build:
  #     context: ./frontend
  #   environment:
  #     VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
  #   ports:
  #     - "${WEB_PORT:-5173}:80"
  #   depends_on:
  #     - api

volumes:
  pgdata:
